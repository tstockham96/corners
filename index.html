<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#111214" />
<meta name="description" content="CORNERS: a daily logic puzzle. Give every row and column its number of dots. Never let four dots form a rectangle." />
<meta property="og:title" content="CORNERS: today's puzzle" />
<meta property="og:description" content="Give every row and column its number of dots. Never let four dots form a rectangle. One unique answer, pure logic." />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://tstockham96.github.io/corners/" />
<meta name="twitter:card" content="summary" />
<meta name="apple-mobile-web-app-title" content="CORNERS" />
<title>CORNERS</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111214'/%3E%3Ccircle cx='20' cy='20' r='7' fill='%23f4f4f2'/%3E%3Ccircle cx='44' cy='20' r='7' fill='%23f4f4f2'/%3E%3Ccircle cx='20' cy='44' r='7' fill='%23f4f4f2'/%3E%3Cpath d='M38 38l12 12M50 38L38 50' stroke='%23f0482a' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon" id="btn-help" aria-label="How to play" data-testid="help">?</button>
    <div class="brand">
      <div class="logo" aria-label="CORNERS">CORNER<span>S</span></div>
      <div class="sub" data-testid="sub"></div>
    </div>
    <button class="icon" id="btn-stats" aria-label="Stats" data-testid="stats-btn">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M5 20V11M12 20V5M19 20v-6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div class="banner hidden" data-testid="challenge-banner"></div>
  <section class="hud">
    <div class="timer" data-testid="timer">0:00</div>
    <div class="level" data-testid="level"></div>
    <div class="marks" data-testid="marks"></div>
  </section>
  <main class="stage">
    <div class="frame" id="frame">
      <div class="board" id="board" data-testid="board"></div>
      <div class="overlay" id="overlay"></div>
    </div>
  </main>
  <div class="hintbox hidden" data-testid="hintbox">
    <div class="hint-head"><b data-testid="hint-title"></b><button class="x" id="hint-close" aria-label="Close hint">✕</button></div>
    <p data-testid="hint-text"></p>
    <div class="hint-actions"><button class="btn small ghost" id="hint-apply" data-testid="hint-apply">Show me</button></div>
  </div>
  <p class="caption" data-testid="caption">Give every row and column its number of dots.<br /><b>Never let four dots form a rectangle.</b></p>
  <nav class="tools">
    <button class="tool" id="btn-undo" data-testid="undo"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,-3)"/></svg><span>Undo</span></button>
    <button class="tool" id="btn-mode" data-testid="mode"><i class="mode-ico"></i><span>Dot</span></button>
    <button class="tool" id="btn-hint" data-testid="hint"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg><span>Hint</span></button>
  </nav>
  <div class="cta hidden" data-testid="cta-results"><button class="btn primary" id="btn-results">See results</button></div>
  <footer class="tagline">One answer · pure logic · new puzzle at midnight</footer>

  <div class="scrim hidden" id="scrim"></div>
  <section class="sheet" id="sheet-intro" data-testid="intro" aria-hidden="true"></section>
  <section class="sheet" id="sheet-results" data-testid="results" aria-hidden="true"></section>
  <section class="sheet" id="sheet-stats" data-testid="stats" aria-hidden="true"></section>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
